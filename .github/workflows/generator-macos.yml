name: Custom macOS Client Generator
run-name: ${{ inputs.label && format('{0} - {1}', 'macOS', inputs.label) || 'Custom macOS Client Generator' }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string
      label:
        description: 'build label (shown in run name)'
        required: false
        default: ''
        type: string

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" 
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.14-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" # >= 3.16 is very slow on my android phone, but work well on most of others. We may switch to new flutter after changing to texture rendering (I believe it can solve my problem).
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  MACOS_NOTARY_KEY_BASE64: "${{ secrets.MACOS_NOTARY_KEY_BASE64 }}"
  # GL!TCH: Apple requires a separate "Developer ID Installer" cert to sign .pkg
  # installers - the "Developer ID Application" cert in MACOS_P12_BASE64 cannot
  # sign/notarize a pkg. Only used for the GlitchHost install-link pkg below; if
  # unset, that pkg is still built and uploaded, just unsigned/un-notarized.
  MACOS_INSTALLER_P12_BASE64: "${{ secrets.MACOS_INSTALLER_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"

jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-for-macos:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge, setup]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel, #macos-latest or macos-14 use M1 now, https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#:~:text=14%20GB-,macos%2Dlatest%20or%20macos%2D14,-The%20macos%2Dlatestlabel
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              # extra-build-args: "--disable-flutter-texture-render", # disable this for mac, because we see a lot of users reporting flickering both on arm and x64, and we can not confirm if texture rendering has better performance if htere is no vram, https://github.com/rustdesk/rustdesk/issues/6296
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    env:
      STATUS_URL: "${{ secrets.GENURL }}/updategh"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
            repository: rustdesk/rustdesk
            ref: refs/tags/${{ env.VERSION }}
            submodules: recursive
  
      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
            repository: rustdesk/rustdesk
            submodules: recursive

      - name: Verify macOS signing credentials
        if: env.MACOS_P12_BASE64 != ''
        shell: bash
        run: |
          echo "${{ secrets.MACOS_P12_BASE64 }}" | base64 --decode > verify.p12
          if openssl pkcs12 -in verify.p12 -passin "pass:${{ secrets.MACOS_P12_PASSWORD }}" -noout -nokeys 2>verify.err; then
            echo "Signing credentials verified OK"
          else
            echo "::error::MACOS_P12_BASE64/MACOS_P12_PASSWORD do not match - $(cat verify.err)"
            exit 1
          fi
          rm -f verify.p12 verify.err

      - name: Apply GL!TCH controller patches (force-login, Tech-tier ID visibility)
        shell: bash
        env:
          GL_APP: ${{ env.appname }}
          FNAME: ${{ env.filename }}
          RUNNO: ${{ github.run_number }}
        run: |
          set -e
          BUILDTAG="build $RUNNO, $(date -u +%b-%d' '%H:%M) UTC"
          echo "== GL!TCH controller patches; appname: '$GL_APP' filename: '$FNAME' =="
          echo "::notice title=GL!TCH patch step::run $RUNNO appname='$GL_APP' filename='$FNAME'"
          LC="$(printf '%s %s' "$GL_APP" "$FNAME" | tr '[:upper:]' '[:lower:]')"
          HOMEPAGE=flutter/lib/desktop/pages/desktop_home_page.dart
          if [[ "$LC" == *connect* || "$LC" == *tech* ]]; then
            # GitHub-hosted Windows runners often default core.autocrlf=true,
            # which would convert the checked-out files to CRLF and break
            # `git apply` below even though every patch here was built and
            # verified against LF.
            git config core.autocrlf false
            echo '' | base64 -d > glitch-force-login.diff
            git apply --verbose glitch-force-login.diff
            echo "force-login applied"
            if [[ "$LC" != *tech* ]]; then
              MSG="GlitchConnect enables you to connect remotely to your station. ($BUILDTAG)"
            else
              MSG="GlitchTech: technician console for connecting to client stations. ($BUILDTAG)"
            fi
            sed -i '' "s|translate(\"outgoing_only_desk_tip\")|'$MSG'|" "$HOMEPAGE"
            grep -q "login.dart" "$HOMEPAGE" && grep -q "_glitchLoginGate" "$HOMEPAGE" || { echo "ERROR: force-login patch missing"; exit 1; }
            grep -q "$MSG" "$HOMEPAGE" || { echo "ERROR: sidebar text patch missing"; exit 1; }
            echo "sidebar text set: $MSG"
          
            # GL!TCH: Tech-tier ID visibility - GlitchConnect and GlitchTech are one
            # build now. The manual ID-entry box, the peer-list row label, and the
            # session tab/window title all check the signed-in user's is_admin/is_tech
            # flag live (see CortenDesk's userPayload()), instead of being baked in
            # per build the way the old no-ID-box patch worked.
            echo '' | base64 -d > glitch-01-is-tech-field.diff
            echo '' | base64 -d > glitch-02-user-model-is-tech.diff
            echo '' | base64 -d > glitch-03-peer-card-id-gate.diff
            echo '' | base64 -d > glitch-04-tab-title-alias.diff
            echo '' | base64 -d > glitch-05-connection-page-id-box.diff
            git apply --verbose glitch-01-is-tech-field.diff
            git apply --verbose glitch-02-user-model-is-tech.diff
            git apply --verbose glitch-03-peer-card-id-gate.diff
            git apply --verbose glitch-04-tab-title-alias.diff
            git apply --verbose glitch-05-connection-page-id-box.diff
            echo '' | base64 -d > glitch-09-remove-connect-autocomplete-id.diff
            git apply --verbose glitch-09-remove-connect-autocomplete-id.diff
            echo '' | base64 -d > glitch-10-group-peer-alias.diff
            git apply --verbose glitch-10-group-peer-alias.diff
            echo '' | base64 -d > glitch-11-group-tab-favorite-star-no-ab.diff
            git apply --verbose glitch-11-group-tab-favorite-star-no-ab.diff
            grep -q '"alias": p.alias,' flutter/lib/common/hbbs/hbbs.dart || { echo "ERROR: group-tab alias mapping missing"; exit 1; }
            grep -q "groupFavStarButton" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab favorite star missing"; exit 1; }
            grep -q "bind.isDisableAb()" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab address-book menu gate missing"; exit 1; }
            echo "Group tab: clean title/subtitle, visible favorite star, no address-book menu item applied"
            echo '' | base64 -d > glitch-13-fav-star-reload.diff
            git apply --verbose glitch-13-fav-star-reload.diff
            grep -q "class GroupFavStarButton" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: favorite-star reload fix missing"; exit 1; }
            grep -q "mainLoadFavPeers()" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: favorite-star reload call missing"; exit 1; }
            echo "Group tab favorite star: immediate toggle + Favorites tab reload applied"
            echo '' | base64 -d > glitch-14-sos-id-title.diff
            git apply --verbose glitch-14-sos-id-title.diff
            grep -q "Gl!tch SOS ID" flutter/lib/common/widgets/connection_page_title.dart || { echo "ERROR: SOS ID title rename missing"; exit 1; }
            echo "Connect panel title renamed to Gl!tch SOS ID"
            echo '' | base64 -d > glitch-15-group-rename-note.diff
            git apply --verbose glitch-15-group-rename-note.diff
            grep -q "class GroupFavStarButton\|Widget groupFavStarButton" flutter/lib/common/widgets/peer_card.dart || true
            grep -q "groupRenameAction" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab rename action missing"; exit 1; }
            grep -q "groupEditNoteAction" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab note action missing"; exit 1; }
            grep -q "api/peers/\$id" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: group-tab update-peer endpoint call missing"; exit 1; }
            echo "Group tab: Admin/Tech rename + note edit applied"
            # GL!TCH: full-file replacement, not a context diff (Lawrence,
            # 2026-11-11) - this rewrites nearly the whole file (Splashtop-
            # style expandable group tree in the main pane, replacing the
            # old sidebar-selection model), so a diff would be both harder
            # to read and more fragile to upstream drift than just writing
            # the finished file directly.
            echo '' | base64 -d > flutter/lib/common/widgets/my_group.dart
            grep -q "_buildGroupTree" flutter/lib/common/widgets/my_group.dart || { echo "ERROR: Group tab tree redesign missing"; exit 1; }
            echo "Group tab: Splashtop-style expandable group tree applied"
            grep -q "canSeeDeviceId" flutter/lib/models/user_model.dart || { echo "ERROR: Tech-tier patches missing"; exit 1; }
            grep -q "canSeeDeviceId" flutter/lib/desktop/pages/connection_page.dart || { echo "ERROR: ID-box runtime gate missing"; exit 1; }
            grep -q "peer.hostname.isNotEmpty" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: peer list ID-removal (hostname fallback) missing"; exit 1; }
            grep -q "peerPrimaryLabel($" flutter/lib/common/widgets/autocomplete.dart || { echo "ERROR: autocomplete ID-removal missing"; exit 1; }
            echo "Tech-tier ID visibility applied"
            echo "Peer ID never shown (alias/hostname only) applied"
            echo '' | base64 -d > glitch-18-update-banner.diff
            git apply --verbose glitch-18-update-banner.diff
            grep -q "class UpdateAvailableBanner" flutter/lib/desktop/pages/connection_page.dart || { echo "ERROR: update banner widget missing"; exit 1; }
            echo "Notify-only update banner applied"
            echo '' | base64 -d > glitch-19-update-sync-rs.diff
            git apply --verbose glitch-19-update-sync-rs.diff
            grep -q "glitch_update_available" src/hbbs_http/sync.rs || { echo "ERROR: Rust heartbeat update-check missing"; exit 1; }
            echo "Rust heartbeat update-check applied"
            echo '' | base64 -d > glitch-20-search-icon-hide-group.diff
            git apply --verbose glitch-20-search-icon-hide-group.diff
            grep -q "currentTab != PeerTabIndex.group.index) const PeerSearchBar" flutter/lib/common/widgets/peer_tab_page.dart || { echo "ERROR: Group-tab search-icon hide missing"; exit 1; }
            echo "Top toolbar search icon hidden on Group tab"
            echo '' | base64 -d > glitch-21-tab-label-group-fallback-mono-icons.diff
            git apply --verbose glitch-21-tab-label-group-fallback-mono-icons.diff
            grep -q "the Group tab, not the Address Book" flutter/lib/common.dart || { echo "ERROR: tab-label group fallback missing"; exit 1; }
            grep -q "colorFilter:" flutter/lib/common.dart || { echo "ERROR: getPlatformImage color param missing"; exit 1; }
            echo "Session-tab title group fallback + monochrome platform icon support applied"
            echo '' | base64 -d > glitch-22-mono-icons-lighter-name.diff
            git apply --verbose glitch-22-mono-icons-lighter-name.diff
            grep -cq "Theme.of(context).dividerColor.withOpacity(0.15)" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: neutral device-tile color missing"; exit 1; }
            grep -q "fontWeight: FontWeight.w400" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: lighter device-name weight missing"; exit 1; }
            echo "Device tiles: neutral background, status-colored logo, lighter name weight applied"
          
            # GL!TCH: brand accent color - 2026-11-11 (Lawrence): the original
            # #B9F020 sampled from the logo reads as too fluorescent/neon in
            # the UI; toned down to a muted green in the same hue family.
            sed -i '' -e 's|0071FF|6FA83F|g' -e 's|2C8CFF|6FA83F|g' flutter/lib/common.dart
            grep -q "6FA83F" flutter/lib/common.dart || { echo "ERROR: brand color patch missing"; exit 1; }
            echo "brand accent applied: #6FA83F"
          
            echo '' | base64 -d > glitch-23-hide-discovery-tab.diff
            git apply --verbose glitch-23-hide-discovery-tab.diff
            grep -q "hard-disable instead of relying on a toggle nobody flips" flutter/lib/models/peer_tab_model.dart || { echo "ERROR: Discovery-tab hide missing"; exit 1; }
            echo "Discovery tab hard-disabled"
          
            echo '' | base64 -d > glitch-24-peer-payload-online-inuse.diff
            git apply --verbose glitch-24-peer-payload-online-inuse.diff
            grep -q "p.inUse" flutter/lib/common/hbbs/hbbs.dart || { echo "ERROR: PeerPayload online/inUse missing"; exit 1; }
            echo "Group-tab peers: online status + in_use flag now forwarded from CortenDesk"
          
            echo '' | base64 -d > glitch-25-peer-model-inuse-fav-backfill.diff
            git apply --verbose glitch-25-peer-model-inuse-fav-backfill.diff
            grep -q "peer.inUse = other.inUse" flutter/lib/models/peer_model.dart || { echo "ERROR: Peer.inUse field missing"; exit 1; }
            grep -q "name == 'fav peer'" flutter/lib/models/peer_model.dart || { echo "ERROR: Favorites group-peer backfill missing"; exit 1; }
            echo "Peer.inUse field added; Favorites tab now backfills from Group-tab peers"
          
            echo '' | base64 -d > glitch-26-peer-card-3color-notags.diff
            git apply --verbose glitch-26-peer-card-3color-notags.diff
            grep -q "widget.tab == PeerTabIndex.group" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: Group-tab tag-dot hide missing"; exit 1; }
            grep -cq "peer.inUse" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: 3-color logo logic missing"; exit 1; }
            echo "Device logos: 3-state status color (blue/green/gray); tag-color dots hidden on Group tab"
          
            echo '' | base64 -d > glitch-27-id-input-tip.diff
            git apply --verbose glitch-27-id-input-tip.diff
            grep -q "sos.glitchdesk.com" src/lang/en.rs || { echo "ERROR: SOS ID tooltip text missing"; exit 1; }
            echo "SOS ID tooltip text replaced"
          
            echo '' | base64 -d > flutter/lib/common/widgets/invite_by_email_dialog.dart
            grep -q "showInviteByEmailDialog" flutter/lib/common/widgets/invite_by_email_dialog.dart || { echo "ERROR: invite-by-email dialog file missing"; exit 1; }
            echo "Invite-by-email dialog file added"
          
            echo '' | base64 -d > glitch-28-invite-by-email-title-hook.diff
            git apply --verbose glitch-28-invite-by-email-title-hook.diff
            grep -q "showInviteByEmailDialog(context)" flutter/lib/common/widgets/connection_page_title.dart || { echo "ERROR: invite-by-email title hook missing"; exit 1; }
            echo "Invite User by Email button added next to the SOS ID title"
          
            echo '' | base64 -d > glitch-30-peer-model-import-fix.diff
            git apply --verbose glitch-30-peer-model-import-fix.diff
            grep -q "import '../common.dart';" flutter/lib/models/peer_model.dart || { echo "ERROR: peer_model.dart gFFI import fix missing"; exit 1; }
            echo "peer_model.dart gFFI import fixed (compile error from build #39)"
          
            echo '' | base64 -d > glitch-31-persist-alias-crosswindow.diff
            git apply --verbose glitch-31-persist-alias-crosswindow.diff
            grep -q "mainSetPeerOption(id: p.id, key: 'alias'" flutter/lib/models/group_model.dart || { echo "ERROR: cross-window alias persistence fix missing"; exit 1; }
            echo "Group-tab aliases now persisted locally for cross-window session-title lookup"
          
            echo '' | base64 -d > glitch-32-fav-star-key-fix.diff
            git apply --verbose glitch-32-fav-star-key-fix.diff
            grep -q "GroupFavStarButton(key: ValueKey(peer.id)" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: favorite-star key fix missing"; exit 1; }
            echo "Group-tab favorite star keyed by peer id (fixes stale star on search)"
          
            echo '' | base64 -d > glitch-34-hbbs.diff
            git apply --verbose glitch-34-hbbs.diff
            grep -q "isFavorite = json\['is_favorite'\] == true" flutter/lib/common/hbbs/hbbs.dart || { echo "ERROR: PeerPayload isFavorite missing"; exit 1; }
            echo "PeerPayload: is_favorite now forwarded from CortenDesk"
          
            echo '' | base64 -d > glitch-34-peer_model.diff
            git apply --verbose glitch-34-peer_model.diff
            grep -q "peer.isFavorite = other.isFavorite" flutter/lib/models/peer_model.dart || { echo "ERROR: Peer.isFavorite missing"; exit 1; }
            echo "Peer.isFavorite field added"
          
            echo '' | base64 -d > glitch-34-group_model.diff
            git apply --verbose glitch-34-group_model.diff
            grep -q "bind.mainStoreFav(favs: serverFavIds)" flutter/lib/models/group_model.dart || { echo "ERROR: server-favorites mirror missing"; exit 1; }
            echo "Server favorites now mirrored into the local favorite list on every pull"
          
            echo '' | base64 -d > glitch-34-peer_card.diff
            git apply --verbose glitch-34-peer_card.diff
            grep -q "_toggleServerFavorite" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: server-synced favorite star missing"; exit 1; }
            grep -q "gFFI.groupModel.peers.refresh()" flutter/lib/common/widgets/peer_card.dart || { echo "ERROR: optimistic in-use refresh missing"; exit 1; }
            echo "Group-tab favorite star is now server-synced; connect flips in-use status immediately"
          
            echo '' | base64 -d > glitch-35-hide-cm-revive.diff
            git apply --verbose glitch-35-hide-cm-revive.diff
            grep -q "hideCm = option2bool" flutter/lib/models/server_model.dart || { echo "ERROR: hideCm revival missing"; exit 1; }
            echo "allow-hide-cm option revived: unattended builds can now actually suppress the Connection Manager window"

            echo '' | base64 -d > glitch-36-chat-cm-gate.diff
            git apply --verbose glitch-36-chat-cm-gate.diff
            grep -q "desktopType == DesktopType.cm && !session.serverModel.hideCm" flutter/lib/models/chat_model.dart || { echo "ERROR: chat-triggered CM window gate missing"; exit 1; }
            echo "Receiving a chat message no longer force-shows the Connection Manager window when hideCm is set"

            echo '' | base64 -d > glitch-37-hide-password-board.diff
            git apply --verbose glitch-37-hide-password-board.diff
            grep -q "isUnattendedPermanentPassword" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "ERROR: hide-password-board patch missing"; exit 1; }
            echo "Password board hidden from the home screen for unattended permanent-password builds"

            echo "::notice title=GL!TCH patches applied::loginGate=$(grep -c _glitchLoginGate "$HOMEPAGE") techGate=$(grep -c canSeeDeviceId flutter/lib/desktop/pages/connection_page.dart) $BUILDTAG"
          else
            echo "Not a GlitchConnect/GlitchTech build; GL!TCH controller patches skipped"
            echo "::notice title=GL!TCH patches SKIPPED::appname='$GL_APP'"
          fi
          

      - name: Install imagemagick and potrace and nasm and and
        shell: bash
        run: |
          brew install imagemagick potrace nasm cmake gcc wget ninja
          echo "$(brew --prefix imagemagick)/bin" >> $GITHUB_PATH

      - name: Update macOS Info.plist and settings
        continue-on-error: false
        shell: bash
        run: |
          # MACSTUFF Update Info.plist
          sed -i '' -e 's|<key>CFBundleName</key>.*<string>.*</string>|<key>CFBundleName</key>\n\t<string>${{ env.appname }}</string>|' ./flutter/macos/Runner/Info.plist
          sed -i '' -e 's|<key>CFBundleDisplayName</key>.*<string>.*</string>|<key>CFBundleDisplayName</key>\n\t<string>${{ env.appname }}</string>|' ./flutter/macos/Runner/Info.plist
          sed -i '' -e 's|<key>CFBundleIdentifier</key>.*<string>.*</string>|<key>CFBundleIdentifier</key>\n\t<string>com.${{ env.appname }}.app</string>|' ./flutter/macos/Runner/Info.plist
          
          # MACSTUFF Update AppInfo.xcconfig
          sed -i '' -e 's|PRODUCT_NAME = .*|PRODUCT_NAME = ${{ env.appname }}|' ./flutter/macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' -e 's|PRODUCT_BUNDLE_IDENTIFIER = .*|PRODUCT_BUNDLE_IDENTIFIER = com.${{ env.appname }}.app|' ./flutter/macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' -e 's|Purslane Ltd.|${{ env.compname }}|' ./flutter/macos/Runner/Configs/AppInfo.xcconfig

          sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs
          sed -i '' -e 's|Purslane Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i '' -e 's|Purslane Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i '' -e 's|Purslane Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i '' -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs
          
          # Update Xcode project settings
          sed -i '' -e 's/PRODUCT_NAME = "RustDesk"/PRODUCT_NAME = "${{ env.appname }}"/' ./flutter/macos/Runner.xcodeproj/project.pbxproj
          sed -i '' -e 's/PRODUCT_BUNDLE_IDENTIFIER = ".*"/PRODUCT_BUNDLE_IDENTIFIER = "com.${{ env.appname }}.app"/' ./flutter/macos/Runner.xcodeproj/project.pbxproj

          # Update CMake settings
          if [ -f "./flutter/macos/CMakeLists.txt" ]; then
            sed -i '' -e 's/set(BINARY_NAME ".*")/set(BINARY_NAME "${{ env.appname }}")/' ./flutter/macos/CMakeLists.txt
          fi

          # Update Podfile - keep the target as 'Runner'
          sed -i '' -e 's/target '"'"'Runner'"'"' do/target '"'"'Runner'"'"' do/' ./flutter/macos/Podfile

          find ./src/lang -name "*.rs" -exec sed -i '' -e 's|RustDesk|${{ env.appname }}|' {} \;
          sed -i '' -e 's|RustDesk|${{ env.appname }}|' ./src/lang/nl.rs
           
          sed -i '' -e 's|https://rustdesk.com|${{ env.urlLink }}|' ./build.py
          sed -i '' -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i '' -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i '' -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i '' -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i '' -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i '' -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i '' -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i '' -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i '' -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis
          sed -i '' -e 's|&download_url|"${{ env.downloadLink }}"|' ./src/updater.rs
          sed -i '' -e 's|$downloadUrl/$downloadFile|${{ env.downloadLink }}|' ./flutter/lib/desktop/widgets/update_progress.dart
          
          # Update slogan - About in en.rs 
          sed -i '' -e 's/("Slogan_tip", "Made with heart in this chaotic world!")/("Slogan_tip", "Powered by ${{ env.appname }}")/' ./src/lang/en.rs
          sed -i '' -e 's/("About RustDesk", "")/("About RustDesk", "About ${{ env.appname }}")/' ./src/lang/en.rs
          

          # Update slogan - About in nl.rs
          sed -i '' -e 's/("Slogan_tip", "Ontwikkeld met het hart voor deze chaotische wereld!")/("Slogan_tip", "Powered by ${{ env.appname }}")/' ./src/lang/nl.rs
          sed -i '' -e 's/("Your Desktop", "Uw Bureaublad")/("Your Desktop", "Uw ${{ env.appname }}")/' ./src/lang/nl.rs
          sed -i '' -e 's/("About RustDesk", "Over RustDesk")/("About RustDesk", "Over ${{ env.appname }}")/' ./src/lang/nl.rs
          sed -i '' -e 's/("About", "Over")/("About", "Over ${{ env.appname }}")/' ./src/lang/nl.rs
            
          # Update pubspec.yaml with proper YAML formatting
          cp ./flutter/pubspec.yaml ./flutter/pubspec.yaml.bak
          echo "  archive: ^3.6.1" > ./flutter/temp_dependency.txt
          awk '/intl:/{print;system("cat ./flutter/temp_dependency.txt");next}1' ./flutter/pubspec.yaml > ./flutter/pubspec.yaml.tmp
          mv ./flutter/pubspec.yaml.tmp ./flutter/pubspec.yaml
          rm ./flutter/temp_dependency.txt 

      - name: set server, serverPort, key, and apiserver
        continue-on-error: true
        shell: bash
        env:
          SERVER_DOMAIN: ${{ env.server }}
          SERVER_PORT_INPUT: ${{ env.serverPort }}
          SERVER_KEY: ${{ env.key }}
          API_SERVER: ${{ env.apiServer }}
        run: |
          # Pass secrets via bash env vars to avoid quoting issues
          if [ ! -f "./libs/hbb_common/src/config.rs" ]; then
            echo "Error: config.rs not found!"
            exit 1
          fi
          if [ ! -f "./src/common.rs" ]; then
            echo "Error: common.rs not found!"
            exit 1
          fi

          # Port must be a number; views.py defaults it to 21116
          if ! [[ "$SERVER_PORT_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Error: serverPort must be a number, got: '$SERVER_PORT_INPUT'"
            exit 1
          fi

          # Derive the port block from the rendezvous port
          # (defaults 21116/21117/21118/21119)
          SERVER_PORT=$SERVER_PORT_INPUT
          RELAY_PORT=$((SERVER_PORT + 1))
          WS_RENDEZVOUS_PORT=$((RELAY_PORT + 1))
          WS_RELAY_PORT=$((WS_RENDEZVOUS_PORT + 1))

          echo "Setting server: $SERVER_DOMAIN"
          echo "Setting ports: $SERVER_PORT, $RELAY_PORT, $WS_RENDEZVOUS_PORT, $WS_RELAY_PORT"

          sed -i '' -e "s|rs-ny.rustdesk.com|$SERVER_DOMAIN|" ./libs/hbb_common/src/config.rs

          # Match on numeric value so the step is independent of defaults
          sed -i '' -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $SERVER_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const WS_RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const WS_RENDEZVOUS_PORT: i32 = $WS_RENDEZVOUS_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|pub const WS_RELAY_PORT: i32 = [0-9][0-9]*;|pub const WS_RELAY_PORT: i32 = $WS_RELAY_PORT;|" ./libs/hbb_common/src/config.rs

          sed -i '' -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$SERVER_KEY|" ./libs/hbb_common/src/config.rs
          sed -i '' -e "s|https://admin.rustdesk.com|$API_SERVER|" ./src/common.rs

          echo "=== Verification ==="
          grep -nE "RENDEZVOUS_PORT|RELAY_PORT|WS_" ./libs/hbb_common/src/config.rs

      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            wget https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.py
            python allowCustom.py
            wget https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/removeSetupServerTip.diff
            git apply removeSetupServerTip.diff
            # sed -i '/intl:/a \ \ archive: ^3.6.1' ./flutter/pubspec.yaml
          
      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Install NASM 2.16.x from official release.
          # Do NOT use `brew install nasm` which installs NASM 3.x.
          # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
          # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        continue-on-error: true
        run: |
            cd $(dirname $(dirname $(which flutter)))
            [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
      
      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i '' -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
            toolchain: ${{ env.MAC_RUST_VERSION }}
            targets: ${{ matrix.job.target }}
            components: "rustfmt"
  
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Magick stuff for macOS
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: false
        shell: bash
        run: |
          # Create all necessary directories first
          mkdir -p ./res
          mkdir -p ./flutter/assets
          mkdir -p ./flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p ./macos/Runner/Assets.xcassets/AppIcon.appiconset
          mkdir -p ./rustdesk/data/flutter_assets/assets

          # Download icon using curl with additional SSL options
          curl -k -L --tlsv1.2 --proto =https --ssl-reqd \
            -H "User-Agent: Mozilla/5.0" \
            "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}" \
            -o ./res/icon.png || wget --no-check-certificate -O ./res/icon.png "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}"
            
          # Backup existing files (if they exist)
          [ -f "./res/32x32.png" ] && mv ./res/32x32.png ./res/32x32.png.bak
          [ -f "./res/64x64.png" ] && mv ./res/64x64.png ./res/64x64.png.bak
          [ -f "./res/128x128.png" ] && mv ./res/128x128.png ./res/128x128.png.bak
          [ -f "./res/mac-icon.png" ] && mv ./res/mac-icon.png ./res/mac-icon.png.bak
          [ -f "./flutter/assets/icon.png" ] && mv ./flutter/assets/icon.png ./flutter/assets/icon.png.bak
          [ -f "./flutter/assets/icon.svg" ] && mv ./flutter/assets/icon.svg ./flutter/assets/icon.svg.bak
          [ -f "./rustdesk/data/flutter_assets/assets/icon.svg" ] && mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
            
          # Create standard app icons
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          
          # Copy icon to Flutter assets
          cp ./res/icon.png ./flutter/assets/icon.png
          cp ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.png
          
          # Convert PNG to SVG using potrace
          magick ./res/icon.png -flatten ./temp_icon.pbm
          potrace --svg -o ./flutter/assets/icon.svg ./temp_icon.pbm
          cp ./flutter/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg
          rm ./temp_icon.pbm
          
          # Create macOS app icons
          magick ./res/icon.png -resize 16x16 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_16.png"
          magick ./res/icon.png -resize 32x32 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png"
          magick ./res/icon.png -resize 64x64 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_64.png"
          magick ./res/icon.png -resize 128x128 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png"
          magick ./res/icon.png -resize 256x256 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png"
          magick ./res/icon.png -resize 512x512 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png"
          magick ./res/icon.png -resize 1024x1024 "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png"

          # Create macOS specific icons
          magick ./res/icon.png -resize 128x128 ./res/mac-icon.png
          
          # Create dark mode tray icon (optimized for macOS menu bar)
          magick ./res/icon.png -resize 22x22 -colorspace gray -alpha set -background none -channel A -evaluate set 100% ./res/mac-tray-dark-x2.png
          
          # Create light mode tray icon (optimized for macOS menu bar)
          magick ./res/icon.png -resize 22x22 -negate -colorspace gray -alpha set -background none -channel A -evaluate set 100% ./res/mac-tray-light-x2.png

          # Create AppIcon.icns (macOS native icon format)
          mkdir -p ./iconset.iconset
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_16.png" "./iconset.iconset/icon_16x16.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png" "./iconset.iconset/icon_16x16@2x.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png" "./iconset.iconset/icon_32x32.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_64.png" "./iconset.iconset/icon_32x32@2x.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png" "./iconset.iconset/icon_128x128.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png" "./iconset.iconset/icon_128x128@2x.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png" "./iconset.iconset/icon_256x256.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" "./iconset.iconset/icon_256x256@2x.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" "./iconset.iconset/icon_512x512.png"
          cp "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png" "./iconset.iconset/icon_512x512@2x.png"
          iconutil -c icns ./iconset.iconset -o ./flutter/macos/Runner/AppIcon.icns
          rm -rf ./iconset.iconset
          
          # Create Contents.json for macOS app icon
          echo '{
            "images": [
              {"size":"16x16","idiom":"mac","filename":"app_icon_16.png","scale":"1x"},
              {"size":"16x16","idiom":"mac","filename":"app_icon_32.png","scale":"2x"},
              {"size":"32x32","idiom":"mac","filename":"app_icon_32.png","scale":"1x"},
              {"size":"32x32","idiom":"mac","filename":"app_icon_64.png","scale":"2x"},
              {"size":"128x128","idiom":"mac","filename":"app_icon_128.png","scale":"1x"},
              {"size":"128x128","idiom":"mac","filename":"app_icon_256.png","scale":"2x"},
              {"size":"256x256","idiom":"mac","filename":"app_icon_256.png","scale":"1x"},
              {"size":"256x256","idiom":"mac","filename":"app_icon_512.png","scale":"2x"},
              {"size":"512x512","idiom":"mac","filename":"app_icon_512.png","scale":"1x"},
              {"size":"512x512","idiom":"mac","filename":"app_icon_1024.png","scale":"2x"}
            ],
            "info": {
              "version": 1,
              "author": "xcode"
            }
          }' > "flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json"
          
          # Copy icons and Contents.json to both locations
          cp -r flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/* macos/Runner/Assets.xcassets/AppIcon.appiconset/
          
          # Verify files exist and show their sizes
          echo "Verifying generated files:"
          ls -lh ./res/mac-tray-dark-x2.png
          ls -lh ./res/mac-tray-light-x2.png
          ls -lh ./res/mac-icon.png
          echo "Flutter macOS app icons:"
          ls -lh flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset/
          echo "Flutter assets:"
          ls -lh flutter/assets/icon.*
          echo "RustDesk Flutter assets:"
          ls -lh rustdesk/data/flutter_assets/assets/

      - name: replace flutter icons
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: false
        shell: bash
        run: |
          cd ./flutter
          # Create required directories and files
          mkdir -p web
          mkdir -p assets
          echo '{"name":"${{ env.appname }}","short_name":"${{ env.appname }}","start_url":"/","display":"standalone","background_color":"#ffffff","theme_color":"#ffffff","description":"A remote desktop software."}' > web/manifest.json
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${{ env.appname }}</title></head><body></body></html>' > web/index.html
          
          # Ensure the AppIcon.appiconset directory exists
          mkdir -p macos/Runner/Assets.xcassets/AppIcon.appiconset
          
          # Copy the processed icons to Flutter locations
          cp ../res/mac-icon.png ./assets/icon.png
          cp ../flutter/assets/icon.svg ./assets/icon.svg || true
          
          flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..
      
      - name: ui.rs
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          cp ./src/ui.rs ./src/ui.rs.bak
          if [ -f "./res/icon.png" ]; then
            SEARCH_STR="iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAACXBIWXMAAEiuAABIrgHwmhA7AAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAEx9JREFUeJztnXmYHMV5h9"
            b64=$(base64 < ./res/icon.png)
            sed -i '' -e "s~$SEARCH_STR.*\"~$b64\"~" ./src/ui.rs
          fi

      - name: fix connection delay
        continue-on-error: false
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          # Precise fix: only extend the direct-connection condition with the
          # key check, instead of globally replacing !key.is_empty() with
          # false (which would also disable TCP encryption and UDP logic).
          sed -i '' -e 's#if is_local || peer_nat_type == NatType::SYMMETRIC {#if is_local || peer_nat_type == NatType::SYMMETRIC || !key.is_empty() {#' ./src/client.rs
          grep -n "key.is_empty()" ./src/client.rs || true

      - name: Patch default view style to Adaptive
        shell: python
        run: |
          # GL!TCH: desktop builds default a new connection's view style to "original" (no
          # scaling); every GlitchTech/GlitchConnect session then needs a tech to switch it
          # to Adaptive by hand. Mobile already defaults to "adaptive" - make desktop match.
          path = "libs/hbb_common/src/config.rs"
          old = (
              '#[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '            keys::OPTION_VIEW_STYLE => self.get_string(key, "original", vec!["adaptive"]),'
          )
          new = (
              '#[cfg(not(any(target_os = "android", target_os = "ios")))]\n'
              '            keys::OPTION_VIEW_STYLE => self.get_string(key, "adaptive", vec!["original"]), // GL!TCH: default to Adaptive'
          )
          with open(path, "r", encoding="utf-8") as f:
              t = f.read()
          if "GL!TCH: default to Adaptive" in t:
              print("view style default: already patched")
          elif t.count(old) == 1:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(t.replace(old, new, 1))
              print("view style default: patched to Adaptive")
          else:
              print("view style default FAILED - expected text found %d times, RustDesk source changed; update this step" % t.count(old))
              raise SystemExit(1)

      - name: use X for offline display instead of orange circle
        continue-on-error: true
        if: env.xOffline == 'true'
        run: |
          wget https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff
          git apply xoffline.diff

      - name: hide-cm
        continue-on-error: true
        if: env.hidecm == 'true'
        run: |
          wget https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/hidecm.diff
          git apply hidecm.diff

      - name: removeNewVersionNotif
        continue-on-error: true
        if: env.removeNewVersionNotif == 'true'
        run: | 
          sed -i '' -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i '' '/let (request, url) =/,/Ok(())/{/Ok(())/!d;}' ./src/common.rs

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Create MacOS directory structure
        run: |
          mkdir -p ./build/macos/Build/Products/Release/RustDesk.app/Contents/MacOS

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i '' -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i '' -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          sed -i '' -e "s/RustDesk.app/\"${{ env.appname }}.app\"/" build.py
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      # - name: Copy service file
      #   run: |
      #     cp -rf ../target/release/service ./build/macos/Build/Products/Release/RustDesk.app/Contents/MacOS/

      - name: Install rcodesign tool
        if: env.MACOS_P12_BASE64 != null
        shell: bash
        run: |
          pushd /tmp
          wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm cmake gcc wget ninja
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi
  
      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V
      
      - name: icon svg handling
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: false
        shell: bash
        run: |
          ASSETS_DIR="build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/App.framework/Versions/Current/Resources/flutter_assets/assets"
          mkdir -p "$ASSETS_DIR"
          if [ -f "$ASSETS_DIR/icon.svg" ]; then
            mv "$ASSETS_DIR/icon.svg" "$ASSETS_DIR/icon.svg.bak"
          fi
          # First convert PNG to PBM (bitmap)
          magick convert ./res/icon.png ./temp_icon.pbm
          # Then use potrace to convert to SVG
          potrace --svg -o "$ASSETS_DIR/icon.svg" ./temp_icon.pbm
          rm ./temp_icon.pbm

      - name: logo handling
        if: ${{ env.logolink_url != 'false' }}
        continue-on-error: false
        shell: bash
        run: |
          ASSETS_DIR="build/macos/Build/Products/Release/RustDesk.app/Contents/Frameworks/App.framework/Versions/Current/Resources/flutter_assets/assets"
          mkdir -p "$ASSETS_DIR"
          curl -k -L --tlsv1.2 --proto =https --ssl-reqd \
            -H "User-Agent: Mozilla/5.0" \
            "${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}&uuid=${{ env.logolink_uuid }}" \
            -o "$ASSETS_DIR/logo.png" || \
          wget --no-check-certificate \
            -O "$ASSETS_DIR/logo.png" \
            "${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}&uuid=${{ env.logolink_uuid }}"

      - name: Embed custom config into the .app bundle (before signing)
        shell: bash
        run: |
          APP=$(find ./flutter/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          echo -n '${{ env.custom }}' > "$APP/Contents/Resources/custom_.txt"
          ls -l "$APP/Contents/Resources/custom_.txt"

      - name: Sign macOS app bundle
        if: env.MACOS_P12_BASE64 != ''
        run: |
            cd flutter/build/macos/Build/Products/Release
            # GL!TCH: rcodesign carries forward whatever entitlements the
            # binary already had (from Xcode's own ad-hoc build-time sign)
            # when none are given explicitly - and that always includes the
            # debug-only com.apple.security.get-task-allow entitlement,
            # which Apple's notary service rejects outright ("Archive
            # contains critical validation errors"). RustDesk's own
            # Release.entitlements is already clean of it; just point
            # rcodesign at it instead of leaving entitlements unspecified.
            ENTITLEMENTS="$GITHUB_WORKSPACE/flutter/macos/Runner/Release.entitlements"
            echo "Entitlements: $ENTITLEMENTS"
            cat "$ENTITLEMENTS"
            # Debug info
            echo "Current directory contents:"
            ls -la
            
            # Rename RustDesk.app to the custom app name first
            if [ -d "RustDesk.app" ]; then
              # First rename the app if it's still called RustDesk.app
              mv "RustDesk.app" "${{ env.appname }}.app"
              echo "Renamed RustDesk.app to ${{ env.appname }}.app"
            fi
            
            echo "App bundle contents after rename:"
            ls -la "${{ env.appname }}.app" || echo "App not found"
            ls -la "${{ env.appname }}.app/Contents" || echo "Contents not found"
            
            # Decode the certificate
            echo "${{ secrets.MACOS_P12_BASE64 }}" | base64 --decode > certificate.p12
            
            # Sign the app bundle and its contents
            if [ -d "${{ env.appname }}.app/Contents/MacOS" ]; then
              echo "Signing main executable..."
              MAIN_EXECUTABLE="${{ env.appname }}.app/Contents/MacOS/${{ env.appname }}"
              if [ -f "$MAIN_EXECUTABLE" ]; then
                rcodesign sign --p12-file certificate.p12 --p12-password "${{ secrets.MACOS_P12_PASSWORD }}" \
                  --code-signature-flags runtime --entitlements-xml-path "$ENTITLEMENTS" "$MAIN_EXECUTABLE"
              else
                echo "Main executable not found at expected path: $MAIN_EXECUTABLE"
                # Try to find the actual executable
                echo "Available executables in MacOS directory:"
                ls -la "${{ env.appname }}.app/Contents/MacOS/"
                ACTUAL_EXECUTABLE=$(ls "${{ env.appname }}.app/Contents/MacOS/" | head -n 1)
                if [ -n "$ACTUAL_EXECUTABLE" ]; then
                  echo "Found executable: $ACTUAL_EXECUTABLE"
                  rcodesign sign --p12-file certificate.p12 --p12-password "${{ secrets.MACOS_P12_PASSWORD }}" \
                    --code-signature-flags runtime --entitlements-xml-path "$ENTITLEMENTS" "${{ env.appname }}.app/Contents/MacOS/$ACTUAL_EXECUTABLE"
                fi
              fi
              
              echo "Signing frameworks..."
              find "${{ env.appname }}.app/Contents/Frameworks" -type f -not -name ".*" -exec \
                rcodesign sign --p12-file certificate.p12 --p12-password "${{ secrets.MACOS_P12_PASSWORD }}" \
                --code-signature-flags runtime {} \;
              
              echo "Signing main bundle..."
              rcodesign sign --p12-file certificate.p12 --p12-password "${{ secrets.MACOS_P12_PASSWORD }}" \
                --code-signature-flags runtime --entitlements-xml-path "$ENTITLEMENTS" "${{ env.appname }}.app"
            else
              echo "Error: Invalid app bundle structure"
              exit 1
            fi
            
            # Clean up
            rm certificate.p12 

      - name: Ad-hoc Sign macOS app bundle (Fallback)
        if: env.MACOS_P12_BASE64 == '' || env.MACOS_P12_BASE64 == null
        shell: bash
        run: |
            cd flutter/build/macos/Build/Products/Release
            
            # Renombrar RustDesk.app al nombre de la marca blanca si aplica
            if [ -d "RustDesk.app" ]; then
              mv "RustDesk.app" "${{ env.appname }}.app"
              echo "RustDesk.app renombrado a ${{ env.appname }}.app"
            fi
            
            TARGET_APP="${{ env.appname }}.app"
            
            if [ -d "$TARGET_APP" ]; then
              echo "Limpiando atributos extendidos..."
              xattr -cr "$TARGET_APP" || true
              
              echo "Re-firmando $TARGET_APP de forma Ad-Hoc y recursiva..."
              codesign --force --deep --sign - "$TARGET_APP"
              echo "Firma Ad-Hoc completada con exito."
            else
              echo "Error: No se encontro la app bundle en $TARGET_APP para firmar."
              exit 1
            fi

      - name: Build GlitchHost install-link pkg (GlitchHost-host.pkg)
        if: env.appname == 'GlitchHost'
        shell: bash
        run: |
          set -e
          # GL!TCH: unlike host-msi.ps1 (which bakes a byte-swappable placeholder
          # into the MSI's Property table, patched in place per-download at serve
          # time), this pkg carries NO per-token placeholder at all and is never
          # touched again after this build. A flat .pkg is a xar archive whose
          # Table of Contents records a checksum of the Scripts/Payload cpio
          # archives; editing even one byte of the postinstall script after this
          # point breaks that checksum (and the notarization ticket this step
          # staples on top), independent of whether the pkg is also code-signed.
          # MSI's structured-storage signing apparently tolerates (or Windows
          # doesn't strictly enforce) exactly this kind of post-sign edit -
          # pkg/Gatekeeper does not, so the per-token value has to arrive another
          # way: the server generates a small per-token *shell script* (plain
          # text, never signed, trivial to template) that the end user runs,
          # which downloads this static pkg unmodified, installs it, and then
          # passes the real one-time token in via the GLITCHHOST_TOKEN env var
          # below - see the InstallLinkController notes left for the
          # coordinating/server-side session.
          APP_DIR="flutter/build/macos/Build/Products/Release"
          APP="$APP_DIR/${{ env.appname }}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found - app bundle must be signed before this step"
            exit 1
          fi

          # GL!TCH: the server/route convention settled on for this (and what a
          # postinstall `uname -m` check will see on Apple Silicon) is "arm64",
          # not Rust's "aarch64" target triple - map it here, once, for every
          # later step in this job that names the pkg.
          MAC_HOST_ARCH="${{ matrix.job.arch }}"
          if [ "$MAC_HOST_ARCH" = "aarch64" ]; then MAC_HOST_ARCH="arm64"; fi
          echo "MAC_HOST_ARCH=$MAC_HOST_ARCH" >> "$GITHUB_ENV"

          WORK=$(mktemp -d)
          mkdir -p "$WORK/scripts" "$WORK/root"
          cp -R "$APP" "$WORK/root/"

          # Written line-by-line (not a heredoc) so the script's own indentation
          # - notably the shebang, which must sit at byte 0 - never depends on
          # this YAML block's indentation.
          PI="$WORK/scripts/postinstall"
          echo '#!/bin/bash' > "$PI"
          echo '# GL!TCH: one-time device-group enrollment, equivalent to the GlitchJoinGroup' >> "$PI"
          echo '# MSI CustomAction on Windows. installer(8) runs this as root. GLITCHHOST_TOKEN' >> "$PI"
          echo '# is set by the server-generated install script that invokes `installer`, NOT' >> "$PI"
          echo '# baked into this pkg - this pkg is static and identical for every download.' >> "$PI"
          echo "BIN=\"/Applications/${{ env.appname }}.app/Contents/MacOS/${{ env.appname }}\"" >> "$PI"
          echo 'if [ -x "$BIN" ] && [ -n "$GLITCHHOST_TOKEN" ]; then' >> "$PI"
          echo '  "$BIN" --assign --token "$GLITCHHOST_TOKEN" --note GlitchHost || true' >> "$PI"
          echo 'fi' >> "$PI"
          echo 'exit 0' >> "$PI"
          chmod +x "$PI"

          pkgbuild \
            --root "$WORK/root" \
            --install-location /Applications \
            --scripts "$WORK/scripts" \
            --identifier com.${{ env.appname }}.host \
            --version 1.0 \
            "$WORK/${{ env.filename }}-host-$MAC_HOST_ARCH-unsigned.pkg"

          cp "$WORK/${{ env.filename }}-host-$MAC_HOST_ARCH-unsigned.pkg" "$GITHUB_WORKSPACE/${{ env.filename }}-host-$MAC_HOST_ARCH.pkg"
          rm -rf "$WORK"

      - name: Sign GlitchHost-host.pkg (Developer ID Installer)
        if: env.appname == 'GlitchHost' && env.MACOS_INSTALLER_P12_BASE64 != ''
        shell: bash
        run: |
          set -e
          PKG="$GITHUB_WORKSPACE/${{ env.filename }}-host-${{ env.MAC_HOST_ARCH }}.pkg"
          echo "${{ secrets.MACOS_INSTALLER_P12_BASE64 }}" | base64 --decode > installer_cert.p12
          mv "$PKG" "$PKG.unsigned"
          rcodesign sign --p12-file installer_cert.p12 --p12-password "${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}" \
            "$PKG.unsigned" "$PKG"
          rm -f installer_cert.p12 "$PKG.unsigned"

      - name: Notarize and staple GlitchHost-host.pkg (Apple Gatekeeper)
        if: env.appname == 'GlitchHost' && env.MACOS_INSTALLER_P12_BASE64 != '' && env.MACOS_NOTARY_KEY_BASE64 != ''
        run: |
          cd $GITHUB_WORKSPACE
          PKG="${{ env.filename }}-host-${{ env.MAC_HOST_ARCH }}.pkg"
          echo "${{ secrets.MACOS_NOTARY_KEY_BASE64 }}" | base64 --decode > notary_key_host.p8
          rcodesign encode-app-store-connect-api-key -o notary_key_host.json \
            "${{ secrets.MACOS_NOTARY_ISSUER_ID }}" "${{ secrets.MACOS_NOTARY_KEY_ID }}" notary_key_host.p8
          rcodesign notary-submit --api-key-path notary_key_host.json --staple "$PKG"
          rm -f notary_key_host.p8 notary_key_host.json

      - name: Upload GlitchHost-host.pkg as a workflow artifact
        if: env.appname == 'GlitchHost'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.filename }}-host-${{ env.MAC_HOST_ARCH }}-pkg
          path: ${{ env.filename }}-host-${{ env.MAC_HOST_ARCH }}.pkg
          retention-days: 14
          # GL!TCH: this is NOT uploaded via save_custom_client - that endpoint
          # writes to the rdgen generator's per-uuid exe/ store, which has
          # nothing to do with /srv/deploy on the CortenDesk host. /srv/deploy
          # is a static, read-only-mounted directory that every existing file
          # in it (including GlitchHost.msi) got placed into by hand over SSH,
          # not through any upload pipeline. Pull this workflow artifact and
          # place it at /opt/glitch-cortendesk-test/deploy/ the same way.

      - name: Create DMG
        run: |
          cd /Users/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/flutter/build/macos/Build/Products/Release
          # Print directory contents for debugging
          echo "Directory contents:"
          ls -la
          # Find the actual .app bundle
          if [ -d "RustDesk.app" ]; then
            # First rename the app if it's still called RustDesk.app
            mv "RustDesk.app" "${{ env.appname }}.app"
          fi
          if [ ! -d "${{ env.appname }}.app" ]; then
            echo "Could not find .app bundle!"
            exit 1
          fi
          echo "Creating DMG for ${{ env.appname }}.app"
          create-dmg \
            --volname "${{ env.appname }}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "${{ env.appname }}.app" 200 190 \
            --hide-extension "${{ env.appname }}.app" \
            --app-drop-link 600 185 \
            "${{ env.appname }}-${{ matrix.job.arch }}.dmg" \
            "${{ env.appname }}.app"
          mv "${{ env.appname }}-${{ matrix.job.arch }}.dmg" $GITHUB_WORKSPACE/
  
      - name: Rename rustdesk
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          echo "Directory contents:"
          ls -la
            
          # Find the DMG file dynamically
          DMG_FILE=$(find . -name "${{ env.appname }}-${{ matrix.job.arch }}.dmg")
            
          if [ -n "$DMG_FILE" ]; then
            echo "Found DMG file: $DMG_FILE"
            mv "$DMG_FILE" "${{ env.filename }}-${{ matrix.job.arch }}.dmg"
            echo "Renamed to ${{ env.filename }}-${{ matrix.job.arch }}.dmg"
          else
            echo "No DMG file found matching the pattern"
            exit 1
          fi

      - name: Sign the DMG (Apple Gatekeeper)
        if: env.MACOS_NOTARY_KEY_BASE64 != ''
        run: |
          cd $GITHUB_WORKSPACE
          DMG_FILE="${{ env.filename }}-${{ matrix.job.arch }}.dmg"
          # GL!TCH: stapling a notarization ticket requires the DMG container
          # itself to carry a code signature - signing the .app inside it
          # earlier isn't enough. Without this, rcodesign notary-submit
          # --staple notarizes fine (the submitted .app is already signed)
          # but then fails at the staple step with "Error: cannot staple DMG
          # without an embedded signature" (2026-11-10 incident, run #22).
          echo "${{ secrets.MACOS_P12_BASE64 }}" | base64 --decode > dmg_certificate.p12
          rcodesign sign --p12-file dmg_certificate.p12 --p12-password "${{ secrets.MACOS_P12_PASSWORD }}" "$DMG_FILE"
          rm -f dmg_certificate.p12

      - name: Notarize and staple the DMG (Apple Gatekeeper)
        if: env.MACOS_NOTARY_KEY_BASE64 != ''
        run: |
          cd $GITHUB_WORKSPACE
          DMG_FILE="${{ env.filename }}-${{ matrix.job.arch }}.dmg"
          echo "${{ secrets.MACOS_NOTARY_KEY_BASE64 }}" | base64 --decode > notary_key.p8
          rcodesign encode-app-store-connect-api-key -o notary_key.json \
            "${{ secrets.MACOS_NOTARY_ISSUER_ID }}" "${{ secrets.MACOS_NOTARY_KEY_ID }}" notary_key.p8
          # GL!TCH: the pinned rcodesign (apple-codesign 0.22.0, released 2022)
          # only knows --api-key-path for this - --api-key-file is a later
          # rename/alias that doesn't exist yet in 0.22.0, which is why run
          # #18 failed with "Found argument '--api-key-file' which wasn't
          # expected... Did you mean '--api-key'?" (exit code 2).
          rcodesign notary-submit --api-key-path notary_key.json --staple "$DMG_FILE"
          rm -f notary_key.p8 notary_key.json

      - name: send file to rdgen server
        if: ${{ env.rdgen == 'true' }}
        shell: bash
        run: |
          curl -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer ${{ env.token }}" \
            -F "file=@$GITHUB_WORKSPACE/${{ env.filename }}-${{ matrix.job.arch }}.dmg" \
            -F "uuid=${{ env.uuid }}" \
            "${{ secrets.GENURL }}/save_custom_client"
          # GlitchHost-host-<arch>.pkg (if built above) is NOT sent here - see
          # the "Upload GlitchHost-host.pkg as a workflow artifact" step; this
          # endpoint writes to the unrelated per-uuid rdgen download store, not
          # /srv/deploy.

      - name: send file to api server
        if: ${{ env.rdgen == 'false' }}
        shell: bash
        run: |
          curl -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer ${{ env.token }}" \
            -F "file=@$GITHUB_WORKSPACE/${{ env.filename }}-${{ matrix.job.arch }}.dmg" \
            "${{ env.apiServer }}/api/save_custom_client"
          # GlitchHost-host-<arch>.pkg (if built above) is NOT sent here either -
          # see the "Upload GlitchHost-host.pkg as a workflow artifact" step.

  cleanup:
    needs: [build-for-macos]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip
